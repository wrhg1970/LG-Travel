<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Rich Gold Gradients -->
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E7CE" />
      <stop offset="25%" stop-color="#C5A880" />
      <stop offset="50%" stop-color="#EED9B9" />
      <stop offset="75%" stop-color="#9C7F55" />
      <stop offset="100%" stop-color="#D7BE98" />
    </linearGradient>

    <radialGradient id="goldRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#233554" />
      <stop offset="70%" stop-color="#0E1830" />
      <stop offset="100%" stop-color="#080E1E" />
    </radialGradient>

    <linearGradient id="ringBevel" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7B613D" />
      <stop offset="30%" stop-color="#F5E4C9" />
      <stop offset="70%" stop-color="#AA8C60" />
      <stop offset="100%" stop-color="#FDF4E7" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#C5A880" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Cog / Luxury Crest Ring -->
  <circle cx="250" cy="250" r="235" fill="none" stroke="url(#goldMetallic)" stroke-width="2" stroke-dasharray="4 6" opacity="0.7"/>
  <circle cx="250" cy="250" r="222" fill="none" stroke="url(#ringBevel)" stroke-width="5" filter="url(#goldGlow)"/>
  <circle cx="250" cy="250" r="214" fill="none" stroke="#C5A880" stroke-width="1.2" opacity="0.6"/>

  <!-- Inner Deep Midnight Blue Disc -->
  <circle cx="250" cy="250" r="210" fill="url(#goldRadial)"/>

  <!-- Circular Text Paths -->
  <path id="textCircleTop" d="M 85,250 A 165,165 0 0,1 415,250" fill="none"/>
  <path id="textCircleBottom" d="M 415,250 A 165,165 0 0,1 85,250" fill="none"/>

  <!-- Top Text: AUTHORIZED VIP CONCIERGE -->
  <text font-family="'Cormorant Garamond', Georgia, serif" font-size="23" font-weight="700" fill="url(#goldMetallic)" letter-spacing="4.8">
    <textPath href="#textCircleTop" startOffset="50%" text-anchor="middle">
      AUTHORIZED VIP CONCIERGE
    </textPath>
  </text>

  <!-- Bottom Text: SAN PEDRO GARZA GARCÍA -->
  <text font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="600" fill="#E2CEB5" letter-spacing="4.2" opacity="0.95">
    <textPath href="#textCircleBottom" startOffset="50%" text-anchor="middle">
      SAN PEDRO GARZA GARCÍA
    </textPath>
  </text>

  <!-- Star Divider Left & Right -->
  <polygon points="76,250 82,243 89,248 84,255 86,263 78,258 71,262 73,254 68,248 76,248" fill="#C5A880"/>
  <polygon points="424,250 430,243 437,248 432,255 434,263 426,258 419,262 421,254 416,248 424,248" fill="#C5A880"/>

  <!-- Inner Beveled Ring -->
  <circle cx="250" cy="250" r="138" fill="none" stroke="url(#ringBevel)" stroke-width="2.5"/>
  <circle cx="250" cy="250" r="132" fill="none" stroke="#C5A880" stroke-width="1" stroke-dasharray="3 3" opacity="0.8"/>

  <!-- Central Crest Shield & Monogram -->
  <!-- 5 Stars Curve on top of shield -->
  <g fill="url(#goldMetallic)">
    <!-- Center star -->
    <polygon points="250,140 253,149 262,149 255,155 257,163 250,158 243,163 245,155 238,149 247,149" transform="scale(0.85) translate(44, 25)"/>
    <!-- Left 1 -->
    <polygon points="230,144 233,152 241,152 235,157 237,165 230,161 223,165 225,157 219,152 227,152" transform="scale(0.75) translate(80, 52)"/>
    <!-- Right 1 -->
    <polygon points="270,144 273,152 281,152 275,157 277,165 270,161 263,165 265,157 259,152 267,152" transform="scale(0.75) translate(88, 52)"/>
    <!-- Left 2 -->
    <polygon points="212,152 215,159 222,159 216,164 218,171 212,167 206,171 208,164 202,159 209,159" transform="scale(0.65) translate(128, 86)"/>
    <!-- Right 2 -->
    <polygon points="288,152 291,159 298,159 292,164 294,171 288,167 282,171 284,164 278,159 285,159" transform="scale(0.65) translate(142, 86)"/>
  </g>

  <!-- Laurel Leaves Surround -->
  <g stroke="url(#goldMetallic)" stroke-width="1.8" fill="none" opacity="0.85">
    <!-- Left Wreath -->
    <path d="M 180,270 C 172,245 178,215 195,190"/>
    <path d="M 180,265 C 174,260 166,260 165,254 C 170,250 177,255 180,258" fill="url(#goldMetallic)"/>
    <path d="M 182,245 C 174,240 167,238 168,230 C 174,228 180,233 182,238" fill="url(#goldMetallic)"/>
    <path d="M 188,225 C 180,218 174,213 177,206 C 183,205 188,212 189,218" fill="url(#goldMetallic)"/>
    <path d="M 198,205 C 192,196 188,190 193,184 C 199,185 202,192 201,198" fill="url(#goldMetallic)"/>

    <!-- Right Wreath -->
    <path d="M 320,270 C 328,245 322,215 305,190"/>
    <path d="M 320,265 C 326,260 334,260 335,254 C 330,250 323,255 320,258" fill="url(#goldMetallic)"/>
    <path d="M 318,245 C 326,240 333,238 332,230 C 326,228 320,233 318,238" fill="url(#goldMetallic)"/>
    <path d="M 312,225 C 320,218 326,213 323,206 C 317,205 312,212 311,218" fill="url(#goldMetallic)"/>
    <path d="M 302,205 C 308,196 312,190 307,184 C 301,185 298,192 299,198" fill="url(#goldMetallic)"/>
  </g>

  <!-- Central Crest Monogram: LG -->
  <text x="250" y="278" font-family="'Cormorant Garamond', Georgia, serif" font-size="78" font-weight="700" fill="url(#goldMetallic)" text-anchor="middle" letter-spacing="4">
    LG
  </text>

  <text x="250" y="306" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#E2CEB5" text-anchor="middle" letter-spacing="6">
    PRIVATE TRAVEL
  </text>
  
  <line x1="205" y1="316" x2="295" y2="316" stroke="url(#goldMetallic)" stroke-width="1.5" opacity="0.75"/>
  <circle cx="250" cy="316" r="3" fill="#C5A880"/>
</svg>
